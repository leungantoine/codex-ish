name: Build Codex for iSH-AOK

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build.yml
      - codex-upstream.json
      - README.md
      - scripts/**
      - build-tools/**
      - patches/**
      - tests/**
      - install.sh

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned OpenAI source
        run: |
          upstream_tag="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_tag"])')"
          upstream_commit="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_commit"])')"
          git clone --depth 1 --branch "$upstream_tag" https://github.com/openai/codex.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "$upstream_commit"
          cp codex-upstream.json upstream/
          python3 scripts/prepare-ish-source.py upstream
          cp -a build-tools upstream/
          cp scripts/build-ish-aarch64.sh scripts/codex-gpt6 upstream/scripts/
          mkdir -p upstream/tests
          cp tests/ish-syscall-probe.c upstream/tests/
          cp README.md upstream/README-ish.md
          chmod +x upstream/build-tools/* upstream/scripts/build-ish-aarch64.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Prepare memory and disk headroom
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          free_kib=$(df -Pk /mnt | awk 'NR == 2 {print $4}')
          swap_mib=$((free_kib / 1024 - 10000))
          if ((swap_mib > 8192)); then swap_mib=8192; fi
          if ((swap_mib >= 2048)); then
            sudo fallocate -l "${swap_mib}M" /mnt/codex-ish-swap
            sudo chmod 600 /mnt/codex-ish-swap
            sudo mkswap /mnt/codex-ish-swap
            sudo swapon /mnt/codex-ish-swap
          fi
          free -h
          df -h /
      - name: Install build and verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends perl make cmake pkg-config clang libclang-dev qemu-user-static binutils file
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: ish-${{ hashFiles('codex-upstream.json') }}-rust195-zig014-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ish-${{ hashFiles('codex-upstream.json') }}-rust195-zig014-
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,uv,dotslash
      - name: Format and test patched subprocess sources
        run: |
          (cd upstream && just fmt)
          (cd upstream && just test -p codex-utils-pty)
          ISH_PATCHED_SOURCE="$PWD/upstream" bash tests/verify-subprocess.sh
          python3 scripts/record-patchinfo.py upstream
      - name: Check Rust and Zig static linking
        working-directory: upstream
        run: |
          set -euo pipefail
          printf 'fn main() { println!("ish-link-ok"); }\n' > "$RUNNER_TEMP/ish-link-check.rs"
          rustc --edition 2024 --target aarch64-unknown-linux-musl \
            -C linker="$PWD/build-tools/zigcc" -C link-self-contained=no \
            "$RUNNER_TEMP/ish-link-check.rs" -o "$RUNNER_TEMP/ish-link-check"
          readelf -h "$RUNNER_TEMP/ish-link-check" | grep -q 'Machine:.*AArch64'
          if readelf -l "$RUNNER_TEMP/ish-link-check" | grep -q INTERP; then exit 1; fi
          if readelf -d "$RUNNER_TEMP/ish-link-check" | grep -q '(NEEDED)'; then exit 1; fi
          qemu-aarch64-static "$RUNNER_TEMP/ish-link-check" | grep -Fx 'ish-link-ok'
      - name: Cross-build and package
        working-directory: upstream
        env:
          CARGO_BUILD_JOBS: '1'
          OPENSSL_BUILD_JOBS: '2'
        run: |
          set -o pipefail
          for attempt in $(seq 1 20); do
            if ./scripts/build-ish-aarch64.sh 2>&1 | tee "$RUNNER_TEMP/build-$attempt.log"; then
              exit 0
            fi
            if ! grep -q 'memory map must have a non-zero length' "$RUNNER_TEMP/build-$attempt.log"; then
              exit 1
            fi
            echo "Retrying intermittent rustc archive mapping error ($attempt/20)"
          done
          exit 1
      - name: Verify ARM64 musl package
        working-directory: upstream
        run: |
          set -euo pipefail
          pkg=dist/codex-ish-aarch64
          test -s dist/codex-ish-aarch64.tar.gz
          for name in codex codex-code-mode-host codex-responses-api-proxy codex-path/rg diagnostics/ish-syscall-probe; do
            file "$pkg/$name"
            readelf -h "$pkg/$name" | grep -q 'Machine:.*AArch64'
            if readelf -l "$pkg/$name" | grep -q INTERP; then
              echo "Unexpected dynamic loader in $name" >&2
              exit 1
            fi
            if readelf -d "$pkg/$name" 2>/dev/null | grep -q '(NEEDED)'; then
              echo "Unexpected shared-library dependency in $name" >&2
              exit 1
            fi
          done
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          expected_version="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_version"])')"
          qemu-aarch64-static "$pkg/codex" --version | grep -Fx "codex-cli $expected_version"
          qemu-aarch64-static "$pkg/codex-path/rg" --version
          qemu-aarch64-static "$pkg/diagnostics/ish-syscall-probe"
          tar -tzf dist/codex-ish-aarch64.tar.gz > "$RUNNER_TEMP/archive-list.txt"
          grep -Fxq './codex-resources/' "$RUNNER_TEMP/archive-list.txt"
          (cd dist && sha256sum codex-ish-aarch64.tar.gz > codex-ish-aarch64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: codex-ish-aarch64
          path: |
            upstream/dist/codex-ish-aarch64.tar.gz
            upstream/dist/codex-ish-aarch64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: ish-${{ hashFiles('codex-upstream.json') }}-rust195-zig014-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-ish-aarch64
      - name: Build released iSH-AOK emulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang llvm libarchive-dev libsqlite3-dev zlib1g-dev musl-tools
          git clone --depth 1 --branch builds/iSH-AOK_556 https://github.com/emkey1/ish-AOK.git emulator
          git -C emulator submodule update --init --depth 1 deps/smallclue
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized -Dguest_archs=arm64 -Dnative_rust=disabled -Dnative_zsh=disabled -Dnative_dash=disabled -Dnative_bash=disabled -Dlog=strace
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Prepare checked Codex and Alpine guest
        run: |
          set -euo pipefail
          mkdir package root
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          tar -xzf codex-ish-aarch64.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          cp -a package root/codex
          musl-gcc -static -O2 -pthread tests/ish-spawn-probe.c -o root/codex/diagnostics/ish-spawn-probe
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
      - name: Verify real model tool requests and shell results
        run: |
          set -euo pipefail
          mapfile -t direct_models < <(python3 -c 'import json; d=json.load(open("package/compat/models-direct.json")); print("\n".join(m["slug"] for m in d["models"] if m["tool_mode"] == "direct" and m["slug"].startswith(("gpt-6-", "gpt-6.", "gpt-5.6-"))))')
          test "${#direct_models[@]}" -gt 0
          for model in "${direct_models[@]}"; do
            python3 tests/reproduce-direct-model.py "linux-direct-$model" "$PWD/package/compat/models-direct.json" "$model" "$PWD/package/codex"
            sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill timeout 240 python3 tests/reproduce-direct-model.py "ish-direct-$model" /codex/compat/models-direct.json "$model" emulator/build/ish -f guest /codex/codex
          done
      - name: Verify installed launcher and explicit model override
        run: |
          set -euo pipefail
          CODEX_ISH_RELEASE_BASE="file://$PWD" sh install.sh
          sh install-direct-tools.sh
          expected_version="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_version"])')"
          test_model="$(python3 -c 'import json; d=json.load(open("package/compat/models-direct.json")); print(next(m["slug"] for m in d["models"] if m["tool_mode"] == "direct" and m["slug"].startswith(("gpt-6-", "gpt-6.", "gpt-5.6-"))))')"
          "$HOME/.local/bin/codex-gpt6" --model "$test_model" --version | grep -Fx "codex-cli $expected_version"
          python3 tests/reproduce-direct-model.py linux-launcher "$PWD/package/compat/models-direct.json" "$test_model" "$HOME/.local/bin/codex-gpt6"
          # Match the host UID used by earlier model tests for the same fakefs.
          sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill timeout 240 python3 tests/reproduce-ish.py ish-1600 emulator/build/ish -f guest /codex/codex --no-daemon --disable code_mode_host -c 'sandbox_mode="danger-full-access"' app-server --stdio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgraded-subprocess-logs
          path: '*-stderr.log'

  publish:
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-ish-aarch64
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          upstream_version="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_version"])')"
          upstream_tag="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_tag"])')"
          upstream_commit="$(python3 -c 'import json; print(json.load(open("codex-upstream.json"))["upstream_commit"])')"
          tag="ish-v${upstream_version}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" codex-ish-aarch64.tar.gz codex-ish-aarch64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Codex ${upstream_version} for iSH-AOK (build ${GITHUB_RUN_NUMBER})" \
            --notes "OpenAI ${upstream_tag}, commit ${upstream_commit}. Static ARM64 musl binaries with subprocess patches and bundled GPT-6, GPT-6.1, and GPT-5.6 direct tools. Verified architecture, checksums, QEMU, patched syscall fallback tests, and real shell roundtrips for all selected direct-tool catalog models in unmodified iSH-AOK 556 emulator. Authentication and this version on physical iOS devices remain to be tested. See README for unsandboxed execution and iOS suspension limits." --latest
