name: Verify and publish finished Codex 0.159.3 binaries
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-1593.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codex-ish-aarch64
          run-id: 36898817843
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: upgraded-subprocess-logs
          run-id: 36898817843
          github-token: ${{ github.token }}
          path: previous-logs
      - name: Inspect failed app-server startup
        run: |
          grep -Ei 'error|failed|invalid|sqlite|bwrap|permission' previous-logs/ish-1593-stderr.log | tail -30 || true
          head -15 previous-logs/ish-1593-stderr.log
      - name: Build released iSH-AOK emulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang llvm libarchive-dev libsqlite3-dev zlib1g-dev musl-tools
          git clone --depth 1 --branch builds/iSH-AOK_556 https://github.com/emkey1/ish-AOK.git emulator
          git -C emulator submodule update --init --depth 1 deps/smallclue
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized -Dguest_archs=arm64 -Dnative_rust=disabled -Dnative_zsh=disabled -Dnative_dash=disabled -Dnative_bash=disabled -Dlog=strace
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Prepare checked Codex and Alpine guest
        run: |
          set -euo pipefail
          mkdir package root
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          tar -xzf codex-ish-aarch64.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          cp -a package root/codex
          musl-gcc -static -O2 -pthread tests/ish-spawn-probe.c -o root/codex/diagnostics/ish-spawn-probe
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
      - name: Verify real model tool requests and shell results
        run: |
          set -euo pipefail
          for model in gpt-6-luna gpt-6-sol gpt-6.1-sol gpt-6-astra; do
            python3 tests/reproduce-direct-model.py "linux-direct-$model" "$PWD/package/compat/models-direct.json" "$model" "$PWD/package/codex"
            sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill timeout 240 python3 tests/reproduce-direct-model.py "ish-direct-$model" /codex/compat/models-direct.json "$model" emulator/build/ish -f guest /codex/codex
          done
      - name: Verify installed launcher and explicit model override
        run: |
          set -euo pipefail
          CODEX_ISH_RELEASE_BASE="file://$PWD" sh install.sh
          sh install-direct-tools.sh
          "$HOME/.local/bin/codex-gpt6" --model gpt-6.1-sol --version | grep -Fx 'codex-cli 0.159.3'
          python3 tests/reproduce-direct-model.py linux-launcher "$PWD/package/compat/models-direct.json" gpt-6-luna "$HOME/.local/bin/codex-gpt6"
          timeout 240 python3 tests/reproduce-ish.py ish-1593 emulator/build/ish -f guest /codex/codex --no-daemon --disable code_mode_host -c 'sandbox_mode="danger-full-access"' app-server --stdio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-subprocess-logs
          path: '*-stderr.log'

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex-ish-aarch64
          run-id: 36898817843
          github-token: ${{ github.token }}
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          tag="ish-v0.159.3-5"
          gh release create "$tag" codex-ish-aarch64.tar.gz codex-ish-aarch64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Codex 0.159.3 for iSH-AOK (verified build 5)" \
            --notes "OpenAI rust-v0.159.3, commit 01fc69f4026735edfdf6789820549727a4867b11. Static ARM64 musl binaries with subprocess patches and bundled GPT-6/GPT-6.1 direct tools. Verified architecture, checksums, QEMU, patched syscall fallback tests, and real shell roundtrips in unmodified iSH-AOK 556 emulator. Authentication and this version on physical iOS devices remain to be tested. See README for unsandboxed execution and iOS suspension limits." --latest
