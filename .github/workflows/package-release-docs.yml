name: Publish verified release with current installation guide
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/package-release-docs.yml
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download only the successfully verified 0.159.3 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/jobs/110492513041 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36913443330 --jq .conclusion)" = success
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          case "$tag" in ish-v0.159.3-*) ;; *) echo 'Expected verified 0.159.3 release' >&2; exit 1 ;; esac
          echo "SOURCE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'codex-ish-aarch64.tar.gz*'
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          mkdir package
          tar -xzf codex-ish-aarch64.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          package/codex --version | grep -Fx 'codex-cli 0.159.3'
          grep -F '01fc69f4026735edfdf6789820549727a4867b11' package/BUILDINFO.txt
          (cd package && sha256sum codex codex-code-mode-host codex-responses-api-proxy codex-path/rg diagnostics/ish-syscall-probe > "$RUNNER_TEMP/verified-executables.sha256")
      - name: Include current installation guide without changing executables
        run: |
          cp README.md package/README.md
          cp compat/README.md package/compat/README.md
          cp setup.sh package/setup.sh
          cp package/BUILDINFO.txt package/BUILDINFO
          (cd package && sha256sum -c "$RUNNER_TEMP/verified-executables.sha256")
          (cd package && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf codex-ish-aarch64.tar.gz -C package .
          sha256sum codex-ish-aarch64.tar.gz > codex-ish-aarch64.tar.gz.sha256
          for name in codex codex-code-mode-host codex-responses-api-proxy codex-path/rg diagnostics/ish-syscall-probe; do
            readelf -h "package/$name" | grep -q 'Machine:.*AArch64'
            if readelf -l "package/$name" | grep -q INTERP; then exit 1; fi
            if readelf -d "package/$name" | grep -q '(NEEDED)'; then exit 1; fi
          done
      - name: Verify complete startup setup against this archive
        run: |
          CODEX_ISH_SETUP_BASE="file://$PWD" CODEX_ISH_RELEASE_BASE="file://$PWD" sh setup.sh
          env -i HOME="$HOME" PATH=/usr/bin:/bin /bin/bash --login -c 'command -v codex; codex --version'
          python3 tests/reproduce-direct-model.py setup-release "$PWD/package/compat/models-direct.json" gpt-6-luna "$HOME/.local/bin/codex"
      - name: Publish installation-ready archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$SOURCE_TAG.1" codex-ish-aarch64.tar.gz codex-ish-aarch64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Codex 0.159.3 for iSH-AOK, with one-command setup' \
            --notes 'Preserves all five executable hashes from the verified 0.159.3 build. Includes current installation and troubleshooting guides, matching GPT-6/GPT-6.1 direct tools, source-input hashes, and the one-command setup script. Native startup setup and a real shell roundtrip passed. The source build passed QEMU, syscall fallback tests, and shell/model roundtrips in unmodified iSH-AOK 556. Physical-device authentication and 0.159.3 task execution remain to be tested. The reported iOS suspension lock termination is not claimed fixed; keep iSH visible during tasks. See README for guest file/network access and approval settings.' --latest
      - uses: actions/upload-artifact@v4
        with:
          name: final-codex-ish-aarch64
          path: |
            codex-ish-aarch64.tar.gz
            codex-ish-aarch64.tar.gz.sha256
