name: Historical iSH-AOK shell and V8 investigation
on:
  workflow_dispatch:
# Manual, pinned reproduction for the 0.158.0 emulator investigation.
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build released iSH-AOK emulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang llvm libarchive-dev libsqlite3-dev zlib1g-dev musl-tools
          git clone --depth 1 --branch builds/iSH-AOK_556 https://github.com/emkey1/ish-AOK.git emulator
          test "$(git -C emulator rev-parse HEAD)" = 19b129bed782897a94d56e1855497f831cfdd405
          git -C emulator submodule update --init --depth 1 deps/smallclue
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized -Dguest_archs=arm64 -Dnative_rust=disabled -Dnative_zsh=disabled -Dnative_dash=disabled -Dnative_bash=disabled -Dlog=strace
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Prepare checked Codex and Alpine guest
        run: |
          set -euo pipefail
          mkdir package root
          base=https://github.com/leungantoine/codex-ish/releases/download/ish-v0.158.0-3.1
          curl -fsSL "$base/codex-ish-aarch64.tar.gz" -o codex-ish-aarch64.tar.gz
          curl -fsSL "$base/codex-ish-aarch64.tar.gz.sha256" -o codex-ish-aarch64.tar.gz.sha256
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          tar -xzf codex-ish-aarch64.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          # Diagnostic copy only: replace the existing fixed-length V8 flag
          # string with --jitless, without changing ELF offsets. Never release it.
          python3 - <<'PYCODE'
          from pathlib import Path
          old = b"--no-maglev --no-turbolev --no-turbo-inline-array-builtins"
          new = b"--jitless --no-maglev --no-turbolev".ljust(len(old), b" ")
          host = Path("package/codex-code-mode-host").read_bytes()
          assert host.count(old) == 1
          out = Path("package/codex-code-mode-host-jitless-diagnostic")
          out.write_bytes(host.replace(old, new))
          out.chmod(0o755)
          PYCODE
          cp -a package root/codex
          musl-gcc -static -O2 -pthread tests/ish-spawn-probe.c -o root/codex/diagnostics/ish-spawn-probe
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
      - name: Baseline actual ARM64 binaries on Linux
        run: |
          CODEX_ISH_RELEASE_BASE="file://$GITHUB_WORKSPACE" sh install.sh
          sh install.sh --launcher-only
          "$HOME/.local/bin/codex" --version
          "$HOME/.local/bin/codex" features list | tee features.log
          grep -E '^code_mode_host[[:space:]].*false$' features.log
          python3 tests/reproduce-ish.py linux "$HOME/.local/bin/codex" app-server
          for mode in fork posix helper; do root/codex/diagnostics/ish-spawn-probe "$mode" "$PWD/package/codex"; done
      - name: Run actual binaries under iSH-AOK guest kernel and JIT
        run: |
          set -euo pipefail
          for mode in fork posix helper; do
            timeout 180 emulator/build/ish -f guest /codex/diagnostics/ish-spawn-probe "$mode" /codex/codex 555>"$mode-kernel.log" 2> >(tee "$mode-stderr.log" >&2)
          done
          timeout 180 emulator/build/ish -f guest /codex/diagnostics/ish-syscall-probe 555>probe-kernel.log 2> >(tee probe-stderr.log >&2)
          timeout 180 emulator/build/ish -f guest /codex/codex --version 555>version-kernel.log 2> >(tee version-stderr.log >&2)
          timeout 600 python3 tests/reproduce-ish.py ish emulator/build/ish -f guest /codex/codex --no-daemon --disable code_mode_host app-server
      - name: Exercise code-mode host and V8 on Linux and iSH
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py linux-code package/codex-code-mode-host || status=1
          sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill /usr/bin/env ISH_LAZY_TRACE=1 /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py ish-code emulator/build/ish -f guest /codex/codex-code-mode-host || status=1
          sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill /usr/bin/env ISH_LAZY_TRACE=1 /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py ish-code-no-probes emulator/build/ish -f guest /usr/bin/env OPENSSL_armcap=0 /codex/codex-code-mode-host || status=1
          /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py linux-code-jitless package/codex-code-mode-host-jitless-diagnostic || status=1
          sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill /usr/bin/env ISH_LAZY_TRACE=1 /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py ish-code-jitless emulator/build/ish -f guest /codex/codex-code-mode-host-jitless-diagnostic || status=1
          exit "$status"
      - name: Test experimental iSH partial mprotect materialization
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path("emulator/emu/memory.c")
          s = p.read_text()
          marker = "int pt_set_flags(struct mem *mem, page_t start, pages_t pages, int flags) {"
          before, after = s.split(marker, 1)
          old = "mem_lazy_materialize_range(mem, start, start + pages);"
          assert old in after
          after = after.replace(old, "mem_lazy_populate(mem, start, start + pages);", 1)
          p.write_text(before + marker + after)
          PYCODE
          git -C emulator diff > experimental-ish-mprotect.patch
          ninja -C emulator/build -j 2 ish
          status=0
          for mode in default jitless; do
            host=/codex/codex-code-mode-host
            if test "$mode" = jitless; then host="$host-jitless-diagnostic"; fi
            sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill /usr/bin/env ISH_LAZY_TRACE=1 /usr/bin/time -v timeout 300 python3 tests/reproduce-code-mode.py "ish-partial-$mode" emulator/build/ish -f guest "$host" || status=1
          done
          exit "$status"
      - name: Verify ordinary shell execution after emulator patch
        if: always()
        run: |
          timeout 600 python3 tests/reproduce-ish.py ish-partial-shell emulator/build/ish -f guest /codex/codex --no-daemon --disable code_mode_host app-server
      - name: Print failure diagnostics
        if: always()
        run: |
          for log in *-stderr.log *-kernel.log; do
            if test -f "$log"; then tail -100 "$log"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ish-reproduction-logs
          path: |
            *-stderr.log
            *-kernel.log
            experimental-ish-mprotect.patch
          if-no-files-found: ignore
