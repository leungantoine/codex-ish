name: Verify GPT-6 direct tools in unchanged iSH-AOK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/direct-tools.yml
      - tests/reproduce-direct-model.py
      - compat/**
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build released iSH-AOK emulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang llvm libarchive-dev libsqlite3-dev zlib1g-dev musl-tools
          git clone --depth 1 --branch builds/iSH-AOK_556 https://github.com/emkey1/ish-AOK.git emulator
          git -C emulator submodule update --init --depth 1 deps/smallclue
          CC=clang meson setup emulator/build emulator --buildtype=debugoptimized -Dguest_archs=arm64 -Dnative_rust=disabled -Dnative_zsh=disabled -Dnative_dash=disabled -Dnative_bash=disabled -Dlog=strace
          ninja -C emulator/build -j 2 ish tools/fakefsify
      - name: Prepare checked Codex and Alpine guest
        run: |
          set -euo pipefail
          mkdir package root
          base=https://github.com/leungantoine/codex-ish/releases/download/ish-v0.158.0-3.1
          curl -fsSL "$base/codex-ish-aarch64.tar.gz" -o codex-ish-aarch64.tar.gz
          curl -fsSL "$base/codex-ish-aarch64.tar.gz.sha256" -o codex-ish-aarch64.tar.gz.sha256
          sha256sum -c codex-ish-aarch64.tar.gz.sha256
          tar -xzf codex-ish-aarch64.tar.gz -C package
          (cd package && sha256sum -c SHA256SUMS)
          base=https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz" -o alpine.tar.gz
          curl -fsSL "$base/alpine-minirootfs-3.23.3-aarch64.tar.gz.sha256" -o alpine.sha256
          test "$(sha256sum alpine.tar.gz | cut -d ' ' -f1)" = "$(cut -d ' ' -f1 alpine.sha256)"
          tar -xzf alpine.tar.gz -C root
          cp -a package root/codex
          cp -a compat root/codex/compat
          musl-gcc -static -O2 -pthread tests/ish-spawn-probe.c -o root/codex/diagnostics/ish-spawn-probe
          tar -czf guest.tar.gz -C root .
          emulator/build/tools/fakefsify guest.tar.gz guest
      - name: Verify real model tool requests and shell results
        run: |
          set -euo pipefail
          for model in gpt-6-luna gpt-6-sol gpt-6-astra; do
            python3 tests/reproduce-direct-model.py "linux-direct-$model" "$PWD/compat/models-direct.json" "$model" "$PWD/package/codex"
            sudo systemd-run --wait --pipe --collect --working-directory="$PWD" -p MemoryMax=2G -p MemorySwapMax=0 -p OOMPolicy=kill timeout 240 python3 tests/reproduce-direct-model.py "ish-direct-$model" /codex/compat/models-direct.json "$model" emulator/build/ish -f guest /codex/codex
          done
      - name: Verify installed launcher and explicit model override
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/opt/codex-ish"
          ln -s "$PWD/package/codex" "$HOME/.local/opt/codex-ish/codex"
          sh install-direct-tools.sh
          "$HOME/.local/bin/codex-gpt6" --model gpt-6-astra --version
          python3 tests/reproduce-direct-model.py linux-launcher "$PWD/compat/models-direct.json" gpt-6-sol "$HOME/.local/bin/codex-gpt6"
      - name: Print diagnostics
        if: always()
        run: |
          for log in *-stderr.log; do
            test ! -f "$log" || tail -60 "$log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-tool-model-logs
          path: '*-stderr.log'
